name: zcash_dart
description: >
  zcash_dart is a Dart package that implements Zcash cryptography and transaction
  management, including Sapling, Orchard, and transparent transactions.
version: 0.3.0
homepage: "https://github.com/mrtnetwork/zcash_dart"
repository: "https://github.com/mrtnetwork/zcash_dart"
Author: mrhaydari.t@gmail.com

environment:
  sdk: '>=3.7.0 <4.0.0'
# Add regular dependencies here.
dependencies:
  blockchain_utils: ^8.0.1
  bitcoin_base: ^8.0.0
    
dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  flutter_lints: ^6.0.0
  onchain_proto:
    git:
      url: https://github.com/mrtnetwork/onchain_proto
  blockchain_utils_connector: ^0.1.1